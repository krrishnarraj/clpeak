name: xpupeak
title: XpuPeak
base: core26
adopt-info: xpupeak
summary: Peak compute, memory bandwidth and latency of CPUs, GPUs and NPUs
description: |
  XpuPeak measures the peak compute throughput, memory bandwidth and latency
  that a machine's CPUs, GPUs and NPUs actually reach. It uses small, tight
  kernels alongside each vendor's own tuned libraries, and runs the same
  tests through every API that exposes a device, so the results line up side
  by side.

  What it measures:

  - Compute: fp32, fp16, fp64, mixed-precision, bf16, integer and
    dot-product rates
  - Matrix engines: cooperative matrices, tensor cores and CPU matrix units
  - Bandwidth: device, local and image memory, host transfers, and CPU cache
    and DRAM bandwidth per level
  - Latency: kernel launch, memory latency per cache level, atomics and
    branch mispredicts
  - AI workloads: matmul, convolution and a transformer block per data
    type, each with its numeric error against fp32

  This snap has the Vulkan, OpenCL and native CPU backends, and the ONNX
  Runtime and LiteRT backends, which use a runtime installed on the host
  (--onnx-lib, --litert-lib). Builds with the CUDA, ROCm and oneAPI backends
  are on the GitHub releases page.

  It has two front-ends over the same engine: the xpupeak command (xpupeak
  --help) and the desktop app, xpupeak.xpupeak-gui, which is also in the app
  launcher on x86-64. Runs can be saved as JSON (-o run.xpupeak.json) and
  compared with a later run (--compare).

  Classic confinement lets XpuPeak reach the GPU drivers and device nodes it
  benchmarks.

  Source, issues and reference results: https://github.com/krrishnarraj/xpupeak

grade: stable
confinement: classic

apps:
  xpupeak:
    command: usr/local/bin/xpupeak
  # The 3.x command: the same program under its old name (a link CMake installs
  # beside xpupeak), which prints the name it was started as.  It runs as
  # xpupeak.clpeak unless the store grants the clpeak alias.
  clpeak:
    command: usr/local/bin/clpeak
  # The Flutter desktop app.  usr/local/bin/xpupeak-gui is a wrapper installed
  # by CMake; the bundle it exec's stays whole under usr/local/gui/ because the
  # runner only starts with its sibling data/ and lib/ next to it.
  # Launcher entry + icon come from snap/gui/, copied verbatim into meta/gui/;
  # the icon is a copy of app/linux/runner/resources/xpupeak_icon.png.
  # Confinement is classic, so the GUI links the host's GTK3 stack.
  xpupeak-gui:
    command: usr/local/bin/xpupeak-gui

parts:
  # Build-time only: the Flutter SDK that src/ffi/CMakeLists.txt drives to build
  # the xpupeak-gui bundle.  Staged, never primed (`prime: [-*]`) -- the SDK is
  # ~1 GB and none of it belongs in the snap.  Pinned to the same release and
  # sha256 as the Flatpak manifest
  # (packaging/flatpak/io.github.krrishnarraj.XpuPeak.yaml); bump both together
  # from
  # https://storage.googleapis.com/flutter_infra_release/releases/releases_linux.json
  flutter-sdk:
    plugin: nil
    source: https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_3.47.5-stable.tar.xz
    source-checksum: sha256/2132e990f236f8d22e7c6314b29a191a95b10d7cbcfec9b4e2e303d996652cbb
    override-pull: |
      # Flutter publishes a linux desktop SDK for x86_64 only, so every other
      # architecture builds CLI-only -- the same outcome as the arm64 CI jobs
      # and the Flatpak's only-arches.
      if [ "$CRAFT_ARCH_BUILD_FOR" = "amd64" ]; then
        craftctl default
      else
        echo "No Flutter linux-$CRAFT_ARCH_BUILD_FOR desktop SDK: building CLI only."
      fi
    override-build: |
      # craft-parts strips a tarball's single top-level directory, so the SDK
      # root is $CRAFT_PART_SRC itself; the fallback keeps this working if that
      # ever changes.  Normalised to <stage>/flutter, which FLUTTER_HOME points
      # at below.  `flutter` writes its downloaded engine artifacts into
      # bin/cache/ inside this tree, so it has to be a copy, not the pull dir.
      if [ -d "$CRAFT_PART_SRC/flutter" ]; then
        src="$CRAFT_PART_SRC/flutter"
      elif [ -d "$CRAFT_PART_SRC/bin" ]; then
        src="$CRAFT_PART_SRC"
      else
        exit 0   # nothing pulled: CLI-only architecture
      fi
      mkdir -p "$CRAFT_PART_INSTALL/flutter"
      cp -a "$src/." "$CRAFT_PART_INSTALL/flutter/"
      # The tarball carries its packer's uid/gid, which cp -a preserves.  The
      # SDK is a git checkout and `flutter build` shells out to git against it,
      # so a foreign owner trips git's "dubious ownership" guard and the build
      # dies with error 128.  Hand the tree to whoever runs the build.
      chown -R "$(id -u):$(id -g)" "$CRAFT_PART_INSTALL/flutter"
    prime:
      - -*

  xpupeak:
    after:
      - flutter-sdk
    source: .
    plugin: cmake
    cmake-parameters:
      # ON is the default; CMake still reports "GUI: disabled" and builds
      # CLI-only wherever no Flutter SDK was staged.
      - -DXPUPEAK_ENABLE_GUI=ON
    build-packages:
      - build-essential
      - clang
      - git
      - cmake
      - libvulkan-dev
      - glslang-tools
      - spirv-tools
      - glslc
      # `flutter build linux` toolchain: ninja + pkg-config + GTK3 headers,
      # plus the curl/unzip it uses to fetch its engine artifacts.
      - ninja-build
      - pkg-config
      - libgtk-3-dev
      - curl
      - unzip
    build-environment:
      # The root CMakeLists resolves the SDK with
      # find_program(flutter HINTS $ENV{FLUTTER_HOME}/bin).
      - FLUTTER_HOME: $CRAFT_STAGE/flutter
      # Keep what the Flutter tool downloads inside this part's build dir.
      - PUB_CACHE: $CRAFT_PART_BUILD/.pub-cache
      - FLUTTER_SUPPRESS_ANALYTICS: "1"
    override-pull: |
      craftctl default
      version=$(git describe --tags --abbrev=0)
      craftctl set version="$version"
    override-build: |
      craftctl default
      # On a CLI-only architecture CMake installs no xpupeak-gui, but the app
      # entry above still has to resolve or `snapcraft pack` fails.  Leave a
      # shim that says why, rather than dropping the snap on those arches.
      gui="$CRAFT_PART_INSTALL/usr/local/bin/xpupeak-gui"
      if [ ! -e "$gui" ]; then
        printf '%s\n' \
          '#!/bin/sh' \
          'echo "xpupeak-gui is not available on this architecture: Flutter ships" >&2' \
          'echo "no linux-arm64 desktop SDK.  Run the xpupeak CLI instead." >&2' \
          'exit 1' > "$gui"
        chmod +x "$gui"
      fi
