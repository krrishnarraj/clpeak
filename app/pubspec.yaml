name: xpupeak
description: "XpuPeak (CPU, GPU and NPU peaks): peak compute, memory bandwidth and latency."
publish_to: 'none'

# versionName / versionCode
version: 3.0.5+49

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.1.0
  provider: ^6.1.0
  path: ^1.9.0
  path_provider: ^2.1.0
  share_plus: ^13.3.0
  file_selector: ^1.0.0
  shared_preferences: ^2.3.0
  url_launcher: ^6.3.0
  wakelock_plus: ^1.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    # The headline catalog: the flagship numbers the results summary shows
    # (lib/src/model/headlines.dart; docs/format-v4.md, The headline catalog).
    - assets/measures.json
    # Sora's licence, which ships with the font and is listed among the app's
    # licences (main.dart).
    - assets/fonts/sora/OFL.txt

  # The app's one typeface (lib/src/theme/xpupeak_theme.dart): the static
  # Google Fonts builds, SIL Open Font License 1.1.
  fonts:
    - family: Sora
      fonts:
        - asset: assets/fonts/sora/Sora-Regular.ttf
          weight: 400
        - asset: assets/fonts/sora/Sora-Medium.ttf
          weight: 500
        - asset: assets/fonts/sora/Sora-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/sora/Sora-Bold.ttf
          weight: 700
        - asset: assets/fonts/sora/Sora-ExtraBold.ttf
          weight: 800
