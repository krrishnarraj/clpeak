name: clpeak
description: "clpeak (compute latency peak): peak compute, memory bandwidth and latency of CPUs, GPUs and NPUs."
publish_to: 'none'

# versionName / versionCode
version: 3.0.4+47

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.1.0
  provider: ^6.1.0
  path: ^1.9.0
  path_provider: ^2.1.0
  share_plus: ^13.3.0
  file_selector: ^1.0.0
  shared_preferences: ^2.3.0
  url_launcher: ^6.3.0
  wakelock_plus: ^1.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

dependency_overrides:
  # 2.5.0 reaches its Kotlin API through package:jni, which looks up
  # kotlin.coroutines.Continuation and friends by name; R8 renames them in
  # release builds, so the first SharedPreferences call throws and the app
  # never leaves the splash (flutter/flutter#194649).  Drop this pin for
  # 2.5.2, which ships the keep rules.
  shared_preferences_android: 2.4.28

flutter:
  uses-material-design: true
