# GitHub Pages site for XpuPeak.  Served by GitHub's native Jekyll build from
# the /docs folder on the default branch, so this stays inside the plugin
# allowlist: no theme gem, no plugins, just a layout and a stylesheet.
title: XpuPeak
description: >-
  Measures the peak compute throughput, memory bandwidth and latency that
  CPUs, GPUs and NPUs actually reach, through each API that exposes them.
url: https://krrishnarraj.github.io
baseurl: /xpupeak

repo: krrishnarraj/xpupeak

# Nothing here needs Jekyll's blogging machinery.
exclude:
  - README.md
plugins: []

# Every page gets the site chrome (format-v4.md sets no layout of its own).
defaults:
  - scope:
      path: ""
    values:
      layout: default
