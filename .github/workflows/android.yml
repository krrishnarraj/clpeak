# Android — sanity build of the Flutter app + its native clpeak_ffi .so.
# Not shipped: `release` does not depend on this job.
name: Android

on:
  workflow_call:

jobs:
  build:
    name: Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter tests (pure Dart)
        working-directory: app
        run: |
          flutter pub get
          flutter analyze
          flutter test

      # This job runs Flutter before the native build configures, so `flutter pub
      # get`'s rewrites of SDK-owned files would be what git-describe sees --
      # stamping the APK's native lib -dirty.  None of it is a real edit.
      - name: Discard Flutter-owned file churn
        run: |
          git status --porcelain --untracked-files=no
          git checkout -- app/

      - name: Build release APK
        working-directory: app
        run: flutter build apk --release

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: clpeak-android-release
          path: app/build/app/outputs/flutter-apk/app-release.apk
