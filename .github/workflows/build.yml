# Top-level CI entry point.  Owns the triggers and the release, and delegates
# the actual building to one reusable workflow per platform family:
#
#   desktop.yml     Linux/Windows/macOS + the CUDA/ROCm/oneAPI variants  (shipped)
#   linux-gcc.yml   GCC-only compile smoke test                          (not shipped)
#   android.yml     Flutter APK sanity build                             (not shipped)
#   ios.yml         Unsigned Flutter iOS build                           (not shipped)
#
# Toolchain installs that more than one job needs live in ../actions/setup-*.
# Reusable workflows must sit directly in .github/workflows/, so the flat
# layout here is a GitHub constraint, not a preference.
name: Build

on:
  push:
    paths-ignore:
      - 'results/**'
      - 'snap/**'
      - 'packaging/**'
      - 'docs/**'
      - '**/*.md'
    branches: [master, main]
    tags: ["*"]

  pull_request:
    paths-ignore:
      - 'results/**'
      - 'snap/**'
      - 'packaging/**'
      - 'docs/**'
      - '**/*.md'
    branches: [master, main]
  workflow_dispatch:

jobs:
  desktop:
    uses: ./.github/workflows/desktop.yml

  linux-gcc:
    uses: ./.github/workflows/linux-gcc.yml

  android:
    uses: ./.github/workflows/android.yml

  ios:
    uses: ./.github/workflows/ios.yml

  # ---------------------------------------------------------------------------
  # GitHub Release — attach binaries on tag push
  # ---------------------------------------------------------------------------
  release:
    name: Create Release
    if: startsWith(github.ref, 'refs/tags/')
    # Android/iOS are sanity builds only and are intentionally not shipped.
    needs: [desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect release assets
        run: |
          mkdir -p release
          # Each desktop job already produced a CPack zip (macOS also a .dmg
          # holding clpeak-gui.app); just gather them.
          find artifacts -name 'clpeak-*.zip' -exec cp {} release/ \;
          find artifacts -name 'clpeak-*.dmg' -exec cp {} release/ \;
          ls -l release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/*
