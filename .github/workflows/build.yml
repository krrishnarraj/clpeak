# Top-level CI entry point.  Owns the triggers and the release, and delegates
# the actual building to one reusable workflow per platform family:
#
#   desktop.yml     Linux/Windows/macOS + the CUDA/ROCm/oneAPI variants  (shipped)
#   linux-gcc.yml   GCC-only compile smoke test                          (not shipped)
#   android.yml     Flutter APK sanity build                             (not shipped)
#   ios.yml         Unsigned Flutter iOS build                           (not shipped)
#
# Toolchain installs that more than one job needs live in ../actions/setup-*.
# Reusable workflows must sit directly in .github/workflows/, so the flat
# layout here is a GitHub constraint, not a preference.
name: Build

on:
  push:
    paths-ignore:
      - 'results/**'
      - 'snap/**'
      - 'packaging/**'
      - 'docs/**'
      - '**/*.md'
    branches: [master, main]
    tags: ["*"]

  pull_request:
    paths-ignore:
      - 'results/**'
      - 'snap/**'
      - 'packaging/**'
      - 'docs/**'
      - '**/*.md'
    branches: [master, main]
  workflow_dispatch:

jobs:
  desktop:
    uses: ./.github/workflows/desktop.yml

  linux-gcc:
    uses: ./.github/workflows/linux-gcc.yml

  android:
    uses: ./.github/workflows/android.yml

  ios:
    uses: ./.github/workflows/ios.yml

  # ---------------------------------------------------------------------------
  # Windows code signing — SignPath Foundation, on tag push
  # ---------------------------------------------------------------------------
  # Every Windows zip goes to SignPath in ONE request, so a release needs one
  # approval in the dashboard rather than one per variant.  SignPath signs the
  # binaries inside each zip (packaging/signpath/artifact-configuration.xml
  # lists them) and hands the zips back under the same names.
  #
  # Setup lives in the repo settings, not here: secret SIGNPATH_API_TOKEN (a
  # SignPath CI user with the submitter role), and variables
  # SIGNPATH_ORGANIZATION_ID, SIGNPATH_PROJECT_SLUG,
  # SIGNPATH_SIGNING_POLICY_SLUG and SIGNPATH_ARTIFACT_CONFIGURATION_SLUG.
  # Missing setup fails the job, and with it the release: a tag never ships
  # unsigned Windows binaries by falling through.
  sign-windows:
    name: Sign Windows binaries
    if: startsWith(github.ref, 'refs/tags/')
    needs: [desktop]
    runs-on: ubuntu-latest
    # The release-signing policy waits for a manual approval; give it the
    # hosted-runner maximum rather than failing a release over a slow click.
    timeout-minutes: 360
    permissions:
      actions: read     # SignPath fetches the unsigned artifact by id
      contents: read

    steps:
      - name: Download Windows zips
        uses: actions/download-artifact@v4
        with:
          pattern: clpeak-windows-*
          path: unsigned
          merge-multiple: true

      - name: List Windows zips
        run: ls -l unsigned && ls unsigned/clpeak-*-windows-*.zip

      - name: Upload unsigned bundle
        id: unsigned
        uses: actions/upload-artifact@v4
        with:
          name: windows-unsigned
          path: unsigned/clpeak-*-windows-*.zip
          if-no-files-found: error

      - name: Submit signing request
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 21000
          output-artifact-directory: signed

      # SignPath returns the zips it was given; a count mismatch means the
      # bundle and the release would disagree, so stop here.
      - name: Check every zip came back
        run: |
          ls -l signed
          sent=$(ls unsigned/clpeak-*-windows-*.zip | wc -l)
          got=$(ls signed/clpeak-*-windows-*.zip | wc -l)
          echo "sent $sent, got $got"
          test "$sent" -eq "$got"

      - name: Upload signed zips
        uses: actions/upload-artifact@v4
        with:
          name: windows-signed
          path: signed/clpeak-*-windows-*.zip
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # GitHub Release — attach binaries on tag push
  # ---------------------------------------------------------------------------
  release:
    name: Create Release
    if: startsWith(github.ref, 'refs/tags/')
    # Android/iOS are sanity builds only and are intentionally not shipped.
    needs: [desktop, sign-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect release assets
        run: |
          mkdir -p release
          # Each desktop job already produced a CPack zip (macOS also a .dmg
          # holding clpeak-gui.app); just gather them.  Windows zips come only
          # from sign-windows: the unsigned copies carry the same names, so
          # they are excluded rather than left to whichever cp runs last.
          find artifacts -name 'clpeak-*.zip' ! -name 'clpeak-*-windows-*' -exec cp {} release/ \;
          cp artifacts/windows-signed/clpeak-*-windows-*.zip release/
          find artifacts -name 'clpeak-*.dmg' -exec cp {} release/ \;
          ls -l release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
